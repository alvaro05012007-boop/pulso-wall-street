# Configuración para publicar el intermediario de precios en vivo en Cloudflare (plan gratis).
# Publicar: npx wrangler deploy   (desde esta carpeta, después de npx wrangler login)
name = "precios-en-vivo"
main = "precios-en-vivo.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Lista de espera de Pulso Premium (emails). Ver y exportar: node ../exportar-lista.mjs
[[kv_namespaces]]
binding = "LISTA"
id = "686fd4e9e58445c39ddf502e4957aff2"
