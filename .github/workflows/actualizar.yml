# Actualiza precios, noticias (si hay clave) e historial en la nube y publica la página en GitHub Pages.
# La nube no guarda nada en el repositorio: arma datos.js, acciones.js y version.js en cada corrida y los publica.
# Así la PC puede subir resúmenes nuevos (datos/*.json) sin chocar nunca con cambios de la nube.
# GitHub usa hora UTC: estos rangos cubren las ventanas de NY con y sin horario de verano; actualizar.mjs --si-toca decide si corre.
name: Actualizar y publicar
on:
  schedule:
    - cron: '*/15 13-14 * * 1-5'   # antes de la apertura (9:00-9:45 NY)
    - cron: '*/15 20-22 * * 1-5'   # después del cierre (16:20-17:30 NY)
    - cron: '*/30 8-12 * * 1-5'    # precios antes de la apertura (desde las 4:00 NY)
    - cron: '*/30 23 * * 1-5'      # precios después del cierre (hasta las 20:00 NY)
    - cron: '*/30 0 * * 2-6'
  push:
    branches: [main]                # la PC subió resúmenes o código: publicar enseguida
  workflow_dispatch:                # botón "Run workflow" para correrlo a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAY_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}   # solo si existe el secreto; el token lo ve únicamente el paso que publica
      TZ: America/La_Paz            # misma zona que la PC, para que las horas de los resúmenes coincidan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/configure-pages@v6
        id: pages
      - name: Traer el último estado publicado
        # precios previos (respaldo si Yahoo falla), registro de ejecuciones y última ventana corrida
        run: |
          mkdir -p logs
          for f in acciones.js empresas.js extendido.js datos.js version.js logs/ejecuciones.jsonl logs/ultima-ventana.txt; do
            curl -fsSL "${{ steps.pages.outputs.base_url }}/$f" -o "$f" || rm -f "$f"
          done
      - name: Actualizar datos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # vacío = se omiten las noticias por API
        run: node actualizar.mjs ${{ github.event_name == 'schedule' && '--si-toca' || '' }}
      - run: rm -rf node_modules    # la página no la necesita; no se publica
      - uses: actions/upload-pages-artifact@v5
        if: hashFiles('datos.js') != ''   # fuera de horario --si-toca no arma nada: no se publica
        with:
          path: .
      - uses: actions/deploy-pages@v5
        if: hashFiles('datos.js') != ''
      - name: Publicar en pulso-wallstreet.pages.dev (Cloudflare)
        # se saltea hasta que exista el secreto CLOUDFLARE_API_TOKEN en GitHub (Settings → Secrets and variables → Actions)
        if: hashFiles('datos.js') != '' && env.HAY_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3766d9c9a79c22b261318f2250286f05
        run: node publicar-cloudflare.mjs
